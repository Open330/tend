name: Demo video

# The product demo video (docs/demo-video/STORYBOARD.md): the real Tend for
# Mac on this runner's own screen, then the iOS app in iPhone and iPad
# simulators, all against the demo fixture's sandboxed tendd. Raw takes,
# per-step screenshots and accessibility dumps come back as an artifact;
# scripts/demo-video/edit.py cuts and captions them. Runs on a pull request
# labelled `demo-video`. Nothing here runs on a developer's machine.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: record
    if: contains(github.event.pull_request.labels.*.name, 'demo-video')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable

      # AppIcon.icon (Icon Composer) needs Xcode 26 or newer on macOS 26 or
      # newer: an older Xcode copies it as a plain folder and the app ships
      # without an icon (v0.10.12), and Xcode 26 on a macOS 15 runner crashes
      # in actool. Hence macos-26, and the newest Xcode 26+ on it.
      - name: Select Xcode 26 or newer
        run: |
          set -euo pipefail
          best=""; bestv=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null || echo 0)
            [ "${v%%.*}" -ge 26 ] 2>/dev/null || continue
            if [ -z "$bestv" ] || [ "$(printf '%s\n%s\n' "$bestv" "$v" | sort -V | tail -1)" = "$v" ]; then
              best="$app"; bestv="$v"
            fi
          done
          if [ -z "$best" ]; then
            ls -d /Applications/Xcode*.app || true
            echo "::error::no Xcode 26 or newer on this runner; AppIcon.icon needs it"
            exit 1
          fi
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # The same key as the release's macOS app job, which restores this
          # cache: by default the key carries the job id, and the two jobs'
          # ids differ, so the release always built Rust cold.
          shared-key: tend-macos-app
          # Only main's cache is visible to other refs; a PR or tag copy is
          # half a gigabyte that crowds out the shared ones.
          save-if: false

      - name: Install xcodegen
        run: brew install xcodegen

      # Restore and save are separate so a build that fails later still
      # leaves its libghostty behind, and only main writes the shared copy
      # (a cache saved from a PR or tag is invisible to every other ref).
      - name: Restore libghostty
        id: libghostty
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/tend-macos/.build/dependencies
            apps/tend-macos/.build/toolchains
            apps/tend-macos/.build/libghostty.stamp
          key: libghostty-${{ runner.os }}-${{ hashFiles('apps/tend-macos/Dependencies.lock', 'apps/tend-macos/Patches/libghostty-spm/*.patch') }}

      - name: Build libghostty and generate the project
        working-directory: apps/tend-macos
        run: |
          Scripts/build-libghostty.sh
          xcodegen generate

      - name: Install tmux
        run: brew install tmux

      - name: Build tend and tendd
        run: cargo build -p tend-cli -p tendd --bins

      - name: Install recording tools
        run: brew install displayplacer cliclick ffmpeg

      - name: Build Tend for Mac
        working-directory: apps/tend-macos
        run: |
          set -o pipefail
          xcodebuild -project Tend.xcodeproj -scheme Tend -configuration Debug \
            -derivedDataPath .build/DerivedData -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/mac-build.log" 2>&1 \
            || { grep -E ': error: ' "$RUNNER_TEMP/mac-build.log" | head -40; tail -40 "$RUNNER_TEMP/mac-build.log"; exit 1; }

      - name: Record Tend for Mac
        run: scripts/demo-video/record-mac.sh apps/tend-macos/.build/DerivedData/Build/Products/Debug/Tend.app "$RUNNER_TEMP/demo"

      - name: Record iPhone and iPad
        run: scripts/demo-video/record-ios.sh "$RUNNER_TEMP/demo"

      - name: Upload the takes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-takes
          path: ${{ runner.temp }}/demo
          retention-days: 7
          if-no-files-found: warn
