name: Demo video

# Probe: can a macOS runner record its own screen and drive a window?
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: contains(github.event.pull_request.labels.*.name, 'demo-video')
    runs-on: macos-26
    steps:
      - name: Probe the screen
        continue-on-error: true
        run: |
          set -x
          mkdir -p "$RUNNER_TEMP/probe"; cd "$RUNNER_TEMP/probe"
          brew install displayplacer cliclick >/dev/null 2>&1 || true
          displayplacer list || true
          system_profiler SPDisplaysDataType || true
          for res in 1920x1080 1920x1200 1680x1050 1440x900 2560x1440 2880x1800; do
            id=$(displayplacer list | sed -n 's/^Persistent screen id: //p' | head -1)
            displayplacer "id:$id res:$res scaling:off origin:(0,0) degree:0" && echo "OK $res" || echo "FAIL $res"
          done
          displayplacer "id:$(displayplacer list | sed -n 's/^Persistent screen id: //p' | head -1) res:1920x1080 hz:60 color_depth:8 scaling:on origin:(0,0) degree:0" || true
          system_profiler SPDisplaysDataType | grep -i resol || true
          screencapture -x shot.png; sips -g pixelWidth -g pixelHeight shot.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: ${{ runner.temp }}/probe/*
