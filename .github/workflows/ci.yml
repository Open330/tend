name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved from main only: every PR push saving its own ~300 MB copy
          # per job filled the 10 GB repository cache and evicted the
          # libghostty and macOS caches the release depends on. PRs restore
          # main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --locked fails the job when Cargo.lock no longer matches the
      # manifests. `cargo install --locked` (README, INSTALL.md, install.sh)
      # and the release build refuse a stale lock, and v0.10.19 shipped one.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The workspace run unifies features, so tend is always built with
      # `dashboard` there. This builds the CLI side the way `cargo install
      # --path crates/tend-cli` does, without the dashboard server.
      - run: cargo clippy -p tend -p tend-cli --all-targets -- -D warnings
      # The account module (`tend-aas`) is optional: tend and tendd must also
      # build, lint clean and answer "not in this build" without it.
      - run: cargo clippy -p tend-cli -p tendd --no-default-features --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `window_placement` drives a private tmux server; without tmux the test
      # skips itself and the regression it guards goes unwatched here.
      - run: sudo apt-get update && sudo apt-get install -y tmux
      # e2e tests shell out to `tendd` / `tend` — those bins live in other
      # workspace packages and cargo test won't build them otherwise.
      - run: cargo build --workspace --bins --locked
      - run: cargo test --workspace --locked

  js-test:
    name: dashboard JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # The dashboard's pure modules (pane drawer, live-output stream,
      # topology, work and collaboration models) are plain ES modules tested
      # with node's built-in runner. `node --test <directory>` does not find
      # these files, so name them with a glob; the job fails if any test does.
      - run: node --test crates/tend/tests-js/*.test.mjs

  onboarding-script:
    name: onboarding script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck scripts/onboard.sh

  sandbox:
    name: sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved from main only: every PR push saving its own ~300 MB copy
          # per job filled the 10 GB repository cache and evicted the
          # libghostty and macOS caches the release depends on. PRs restore
          # main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: cargo build --workspace --bins
      - run: shellcheck scripts/tend-sandbox.sh scripts/sandbox-smoke.sh
      # A sandbox that leaks a daemon or a tmux server is worse than no
      # sandbox, so the suite asserts teardown is total from every state.
      - run: scripts/sandbox-smoke.sh
      # A sandbox that reads the caller's ~/.tmux.conf is not a sandbox: their
      # hooks run inside it, and tend's own `tmux-auto-view` detaches the
      # learner the moment they attach.
      - run: python3 scripts/config-isolation-check.py

  live-tour:
    name: live tour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved from main only: every PR push saving its own ~300 MB copy
          # per job filled the 10 GB repository cache and evicted the
          # libghostty and macOS caches the release depends on. PRs restore
          # main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: cargo build --workspace --bins
      # The tour claims it never intercepts a keystroke, so every step has to be
      # reachable by typing the command the narration asks for. This types them.
      - run: scripts/live-tour-smoke.py --tend target/debug/tend
      - run: scripts/live-tour-smoke.py --tend target/debug/tend --lang ko
      # Issue #76 was a gate with no way around it; this is the check that
      # the live tour cannot repeat that.
      - run: scripts/live-tour-smoke.py --tend target/debug/tend --mode skip
      # `exit` closes the last pane, and with it the sandbox server the tour is
      # polling. That is a way out, not a crash.
      - run: python3 scripts/exit-check.py --tend target/debug/tend

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved from main only: every PR push saving its own ~300 MB copy
          # per job filled the 10 GB repository cache and evicted the
          # libghostty and macOS caches the release depends on. PRs restore
          # main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace

  deny:
    name: cargo-deny (${{ matrix.target }})
    runs-on: ubuntu-latest
    # One run per supported target. A single run over the union of targets
    # follows edges no build compiles (tend-app's Windows-only wry and tray
    # crates into their Linux-only dependencies) and flags crates that ship
    # nowhere, while a target-narrowed audit would drop the others' real ones.
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features --locked --target ${{ matrix.target }}

  windows:
    name: windows
    runs-on: windows-latest
    env:
      # No debug info and no incremental state: the test binaries are large
      # on Windows, and the cache stays small.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      # install-tend.ps1 runs on people's machines and its download path has
      # no other test: catch a function variable that hides a script-level
      # one (PowerShell names ignore case), which broke the v0.10.24 install.
      # Separate steps: in one pwsh step a later command's exit code would
      # hide a failing fixture run.
      - name: scope check fixtures
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-ps-scope.tests.ps1
      - name: install-tend.ps1 scope check
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-ps-scope.ps1 scripts/install-windows.ps1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The live rmux tests (agent_move, the rmux backend) drive a private
      # rmux server; without rmux on PATH they skip themselves. The release
      # zip is the install docs/WINDOWS.md names besides winget, which hosted
      # runners do not reliably have; its checksum is the release's
      # SHA256SUMS entry.
      - name: Install rmux 0.10.0
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "rmux.zip"
          Invoke-WebRequest -UseBasicParsing "https://github.com/Helvesec/rmux/releases/download/v0.10.0/rmux-0.10.0-windows-x86_64.zip" -OutFile $zip
          $sum = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($sum -ne "e315e2d51d927ba9621732812c0f932c862d05f4b677dbf3cab76f0d27372a70") { throw "rmux zip checksum $sum" }
          $root = Join-Path $env:RUNNER_TEMP "rmux"
          Expand-Archive $zip $root
          # The archive's top level holds the client and its daemon (a second
          # rmux.exe sits under libexec): name the directory, do not search.
          $dir = Join-Path $root "rmux-0.10.0-windows-x86_64"
          foreach ($exe in "rmux.exe", "rmux-daemon.exe") { if (-not (Test-Path (Join-Path $dir $exe))) { throw "no $exe in $dir" } }
          $dir >> $env:GITHUB_PATH
      - name: rmux is the pinned one
        shell: pwsh
        run: |
          $source = (Get-Command rmux).Source
          if (-not $source.StartsWith((Join-Path $env:RUNNER_TEMP "rmux"))) { throw "rmux resolves to $source" }
          $version = (rmux -V)
          if ($version -ne "rmux 0.10.0") { throw "rmux -V: $version" }
          "$source $version"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The integration tests run the tend and tendd binaries.
      - run: cargo build --locked --bins -p tend-cli -p tendd
      # `tend`'s own unit tests still assume Unix paths in fixtures
      # (docs/WINDOWS.md); these four packages pass on Windows.
      - run: cargo test --locked -p tend-cli -p tendd -p tend-work -p tend-app
