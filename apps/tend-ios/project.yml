name: TendiOS

# Tend for iPhone and iPad: a client of one tend dashboard (see
# docs/proposals/IOS_APP.md). One universal target; the decision models are
# shared with Tend for Mac from apps/shared/Sources.
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Tend:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../shared/Sources
      - path: Resources
    settings:
      base:
        # Registered in the owner's Apple developer team on 2026-11-16.
        PRODUCT_BUNDLE_IDENTIFIER: dev.tend.ios
        PRODUCT_NAME: Tend
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Tend
        # Start Work asks for Face ID; without this key iOS refuses (or ends
        # the app) on a phone with Face ID.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Tend asks for Face ID before it starts agents on your hosts.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # tokens.json "accent": the Mac's default controlAccentColor.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
      # Push (docs/proposals/IOS_APP.md, "Push"): Debug builds register with
      # APNs' development environment, TestFlight and store builds with
      # production. The App ID needs the Push Notifications capability.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Tend-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Tend-Release.entitlements

  TendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # Responses recorded from a real tendd, shared with the Mac app.
      - path: ../shared/Fixtures
        buildPhase: resources
        excludes: ["*.md"]
      # The one design-token file (with the web dashboard and the Mac app);
      # DesignTokensTests checks Theme.swift against it.
      - path: ../shared/Design/tokens.json
        buildPhase: resources
    dependencies:
      - target: Tend
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.tend.ios.tests

  TendUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Tend
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.tend.ios.uitests
        TEST_TARGET_NAME: Tend

schemes:
  Tend:
    build:
      targets:
        Tend: all
        TendTests: [test]
        TendUITests: [test]
    test:
      targets:
        - TendTests
        - TendUITests
      commandLineArguments:
        "-AppleLanguages (en)": true
